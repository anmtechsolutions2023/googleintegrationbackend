<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gmail Login & API Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      .token-box {
        background: #f4f4f4;
        padding: 10px;
        border: 1px solid #ddd;
        word-break: break-all;
        margin-top: 10px;
      }
      .api-test-results {
        border: 1px dashed #333;
        padding: 15px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Google Sign-In with Custom Role Authorization</h1>
    <p>Sign in to get your custom application token:</p>

    <!-- // *** IMPORTANT: REPLACE WITH YOUR ACTUAL CLIENT ID data-client_id*** -->
    <div
      id="g_id_onload"
      data-client_id="data-client_id"
      data-callback="handleCredentialResponse"
      data-auto_prompt="false"
    ></div>
    <div
      class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="sign_in_with"
      data-shape="rectangular"
      data-logo_alignment="left"
    ></div>

    <h2>Application Token (Bearer)</h2>
    <div id="appTokenDisplay" class="token-box">No token yet.</div>

    <h2>API Endpoint Test</h2>
    <button onclick="testApi('/api/data/admin/settings')">
      Test Admin Resource
    </button>
    <button onclick="testApi('/api/data/reports')">Test Editor Resource</button>
    <button onclick="testApi('/api/data/public')">Test Viewer Resource</button>
    <button onclick="testApi('/api/data/general')">
      Test Any scope Resource
    </button>
    <div class="api-test-results">
      <h3>API Test Result:</h3>
      <pre id="apiResultDisplay">Click a button to test.</pre>
    </div>

    <script>
      // *** IMPORTANT: REPLACE WITH YOUR ACTUAL CLIENT ID replace data-client_id***
      const GOOGLE_CLIENT_ID = 'data-client_id'
      const BACKEND_URL = 'http://localhost:3001'
      let APP_TOKEN = ''

      function handleCredentialResponse(response) {
        exchangeToken(response.credential)
      }

      async function exchangeToken(idToken) {
        try {
          const response = await fetch(`${BACKEND_URL}/api/auth/google`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_token: idToken }),
          })

          const data = await response.json()

          if (data.success) {
            APP_TOKEN = data.token
            document.getElementById('appTokenDisplay').textContent = APP_TOKEN
            alert(`Login Success! Your role is: ${data.user.scopes}`)
          } else {
            alert('Backend Authentication Failed: ' + data.message)
            document.getElementById(
              'appTokenDisplay'
            ).textContent = `ERROR: ${data.message}`
          }
        } catch (error) {
          console.error('Error exchanging token:', error)
          alert('Network or server error during authentication.')
        }
      }

      async function testApi(endpoint) {
        if (!APP_TOKEN) {
          alert('Please sign in first to get an application token.')
          return
        }

        document.getElementById(
          'apiResultDisplay'
        ).textContent = `Testing ${endpoint}...`

        try {
          const response = await fetch(`${BACKEND_URL}${endpoint}`, {
            method: 'GET',
            headers: {
              Authorization: `Bearer ${APP_TOKEN}`,
            },
          })

          const data = await response.json()

          document.getElementById('apiResultDisplay').textContent =
            JSON.stringify(data, null, 2)
        } catch (error) {
          console.error('Network or CORS Error during API test:', error)
          document.getElementById(
            'apiResultDisplay'
          ).textContent = `NETWORK ERROR: ${error.message}`
        }
      }
    </script>
  </body>
</html>
